name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: verify
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: build artifacts
        run: VERSION=${GITHUB_REF_NAME} make release

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/repolens-linux-amd64
            bin/repolens-linux-arm64
            bin/sha256sums.txt
